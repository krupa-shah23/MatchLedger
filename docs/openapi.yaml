openapi: 3.1.0
info:
  title: MatchLedger API
  version: 0.1.0
  description: |
    REST contract for the MatchLedger demo. Money and prices are decimal
    strings, never JSON numbers. Quantities are digit strings in responses and
    integers or digit strings in requests.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Orders
  - name: Market
  - name: Accounts
  - name: Risk
  - name: Reconciliation
  - name: Administration
  - name: System
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Exchange credentials for a JWT
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}
      responses:
        '200': {description: Authenticated, content: {application/json: {schema: {$ref: '#/components/schemas/LoginResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register a demo TRADER
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh a JWT
      responses:
        '200': {description: Refreshed, content: {application/json: {schema: {$ref: '#/components/schemas/LoginResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /me:
    get:
      tags: [Auth]
      summary: Current identity
      responses:
        '200': {description: Identity, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /orders:
    post:
      tags: [Orders]
      summary: Submit an order
      x-roles: [TRADER]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/OrderRequest'}}
      responses:
        '202': {description: Received, content: {application/json: {schema: {$ref: '#/components/schemas/OrderAcceptedResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      tags: [Orders]
      summary: List orders
      x-roles: [TRADER, RISK, OPS, ADMIN]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/OrderStatus'}, {$ref: '#/components/parameters/SymbolQuery'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}]
      responses:
        '200': {description: Orders, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedOrders'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /orders/{id}:
    parameters: [{$ref: '#/components/parameters/OrderId'}]
    get:
      tags: [Orders]
      summary: Read an order
      x-roles: [TRADER, RISK, OPS, ADMIN]
      responses:
        '200': {description: Order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Orders]
      summary: Request cancellation
      x-roles: [TRADER]
      responses:
        '202': {description: Cancel requested, content: {application/json: {schema: {$ref: '#/components/schemas/CancelAcceptedResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [Orders]
      summary: Amend an order
      x-roles: [TRADER]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/AmendRequest'}}
      responses:
        '202': {description: Amend requested, content: {application/json: {schema: {$ref: '#/components/schemas/AmendAcceptedResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /orders/{id}/events:
    get:
      tags: [Orders]
      summary: Order audit timeline
      x-roles: [TRADER, RISK, OPS, ADMIN]
      parameters: [{$ref: '#/components/parameters/OrderId'}]
      responses:
        '200': {description: Audit timeline, content: {application/json: {schema: {$ref: '#/components/schemas/OrderEvents'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /instruments:
    get:
      tags: [Market]
      summary: List instruments
      responses:
        '200': {description: Instruments, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedInstruments'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /instruments/{symbol}:
    get:
      tags: [Market]
      summary: Read an instrument
      parameters: [{$ref: '#/components/parameters/Symbol'}]
      responses:
        '200': {description: Instrument, content: {application/json: {schema: {$ref: '#/components/schemas/Instrument'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /symbols/{symbol}/book:
    get:
      tags: [Market]
      summary: Book snapshot
      parameters: [{$ref: '#/components/parameters/Symbol'}, {$ref: '#/components/parameters/Depth'}]
      responses:
        '200': {description: Book, content: {application/json: {schema: {$ref: '#/components/schemas/Book'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /symbols/{symbol}/trades:
    get:
      tags: [Market]
      summary: Recent trades
      parameters: [{$ref: '#/components/parameters/Symbol'}, {$ref: '#/components/parameters/TradeLimit'}]
      responses:
        '200': {description: Trades, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedTrades'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /symbols/{symbol}/status:
    get:
      tags: [Market]
      summary: Symbol status
      parameters: [{$ref: '#/components/parameters/Symbol'}]
      responses:
        '200': {description: Status, content: {application/json: {schema: {$ref: '#/components/schemas/SymbolStatus'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /accounts/{id}/balances:
    get:
      tags: [Accounts]
      summary: Account balances
      x-roles: [TRADER, RISK, OPS, ADMIN]
      parameters: [{$ref: '#/components/parameters/AccountPath'}]
      responses:
        '200': {description: Balances, content: {application/json: {schema: {$ref: '#/components/schemas/Balances'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /accounts/{id}/positions:
    get:
      tags: [Accounts]
      summary: Account positions
      x-roles: [TRADER, RISK, OPS, ADMIN]
      parameters: [{$ref: '#/components/parameters/AccountPath'}]
      responses:
        '200': {description: Positions, content: {application/json: {schema: {$ref: '#/components/schemas/Positions'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /accounts/{id}/pnl:
    get:
      tags: [Accounts]
      summary: Account P&L
      x-roles: [TRADER, RISK, OPS, ADMIN]
      parameters: [{$ref: '#/components/parameters/AccountPath'}]
      responses:
        '200': {description: P&L, content: {application/json: {schema: {$ref: '#/components/schemas/Pnl'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /accounts/{id}/reservations:
    get:
      tags: [Accounts]
      summary: Account reservations
      x-roles: [TRADER, RISK, OPS, ADMIN]
      parameters: [{$ref: '#/components/parameters/AccountPath'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/ReservationStatus'}]
      responses:
        '200': {description: Reservations, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedReservations'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /accounts/{id}/ledger:
    get:
      tags: [Accounts]
      summary: Account ledger
      x-roles: [TRADER, RISK, OPS, ADMIN]
      parameters: [{$ref: '#/components/parameters/AccountPath'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}]
      responses:
        '200': {description: Ledger, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedLedger'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /risk/accounts/{id}/limits:
    get:
      tags: [Risk]
      summary: Read risk limits
      x-roles: [RISK, ADMIN]
      parameters: [{$ref: '#/components/parameters/AccountPath'}]
      responses:
        '200': {description: Limits, content: {application/json: {schema: {$ref: '#/components/schemas/Limits'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Risk]
      summary: Update risk limits
      x-roles: [RISK]
      parameters: [{$ref: '#/components/parameters/AccountPath'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/Limits'}}
      responses:
        '200': {description: Updated limits, content: {application/json: {schema: {$ref: '#/components/schemas/Limits'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /risk/rejections:
    get:
      tags: [Risk]
      summary: Risk rejection feed
      x-roles: [RISK, ADMIN]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/RejectReason'}, {$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/SymbolQuery'}, {$ref: '#/components/parameters/From'}]
      responses:
        '200': {description: Rejections, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedRejections'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /risk/breakers:
    get:
      tags: [Risk]
      summary: Breaker states
      x-roles: [RISK, ADMIN]
      responses:
        '200': {description: Breakers, content: {application/json: {schema: {$ref: '#/components/schemas/Breakers'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /risk/symbols/{symbol}/halt:
    post:
      tags: [Risk]
      summary: Halt a symbol
      x-roles: [RISK]
      parameters: [{$ref: '#/components/parameters/Symbol'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 5, maxLength: 200}}}}}
      responses:
        '202': {description: Halt requested, content: {application/json: {schema: {$ref: '#/components/schemas/CommandAcceptedResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /risk/symbols/{symbol}/resume:
    post:
      tags: [Risk]
      summary: Resume a symbol
      x-roles: [RISK]
      parameters: [{$ref: '#/components/parameters/Symbol'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 5, maxLength: 200}}}}}
      responses:
        '202': {description: Resume requested, content: {application/json: {schema: {$ref: '#/components/schemas/CommandAcceptedResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /risk/symbols/{symbol}/breaker-config:
    put:
      tags: [Risk]
      summary: Configure a breaker
      x-roles: [RISK]
      parameters: [{$ref: '#/components/parameters/Symbol'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BreakerConfig'}}}
      responses:
        '200': {description: Configuration, content: {application/json: {schema: {$ref: '#/components/schemas/BreakerConfig'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /recon/runs:
    post:
      tags: [Reconciliation]
      summary: Upload an external statement
      x-roles: [OPS]
      requestBody:
        required: true
        content:
          multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}}
      responses:
        '202': {description: Processing, content: {application/json: {schema: {$ref: '#/components/schemas/ReconUploadResponse'}}}}
        '200': {description: Duplicate file, content: {application/json: {schema: {$ref: '#/components/schemas/ReconUploadResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      tags: [Reconciliation]
      summary: List reconciliation runs
      x-roles: [OPS, ADMIN]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Runs, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedRuns'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /recon/runs/{id}:
    get:
      tags: [Reconciliation]
      summary: Read a reconciliation run
      x-roles: [OPS, ADMIN]
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200': {description: Run, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /recon/breaks:
    get:
      tags: [Reconciliation]
      summary: List reconciliation breaks
      x-roles: [OPS, ADMIN]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/RunIdQuery'}, {$ref: '#/components/parameters/BreakType'}, {$ref: '#/components/parameters/BreakStatus'}]
      responses:
        '200': {description: Breaks, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedBreaks'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /recon/breaks/{id}:
    get:
      tags: [Reconciliation]
      summary: Read a reconciliation break
      x-roles: [OPS, ADMIN]
      parameters: [{$ref: '#/components/parameters/BreakId'}]
      responses:
        '200': {description: Break, content: {application/json: {schema: {$ref: '#/components/schemas/Break'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /recon/breaks/{id}/status:
    post:
      tags: [Reconciliation]
      summary: Change reconciliation break status
      x-roles: [OPS]
      parameters: [{$ref: '#/components/parameters/BreakId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BreakStatusRequest'}}}
      responses:
        '200': {description: Updated break, content: {application/json: {schema: {$ref: '#/components/schemas/Break'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /recon/breaks/{id}/resolve:
    post:
      tags: [Reconciliation]
      summary: Resolve reconciliation break
      x-roles: [OPS]
      parameters: [{$ref: '#/components/parameters/BreakId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BreakResolveRequest'}}}
      responses:
        '200': {description: Resolved break, content: {application/json: {schema: {$ref: '#/components/schemas/Break'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /recon/breaks/{id}/audit:
    get:
      tags: [Reconciliation]
      summary: Read break audit
      x-roles: [OPS, ADMIN]
      parameters: [{$ref: '#/components/parameters/BreakId'}]
      responses:
        '200': {description: Audit entries, content: {application/json: {schema: {$ref: '#/components/schemas/BreakAudit'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/users:
    get:
      tags: [Administration]
      summary: List users
      x-roles: [ADMIN]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Users, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedUsers'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Administration]
      summary: Create user
      x-roles: [ADMIN]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserRequest'}}}
      responses:
        '201': {description: Created user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /admin/accounts:
    get:
      tags: [Administration]
      summary: List accounts
      x-roles: [ADMIN]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Accounts, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedAccounts'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Administration]
      summary: Create account
      x-roles: [ADMIN]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminAccountRequest'}}}
      responses:
        '201': {description: Created account, content: {application/json: {schema: {$ref: '#/components/schemas/AdminAccountResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /admin/accounts/{id}/deposit:
    post:
      tags: [Administration]
      summary: Deposit simulated funds
      x-roles: [ADMIN]
      parameters: [{$ref: '#/components/parameters/AccountPath'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DepositRequest'}}}
      responses:
        '200': {description: Deposit result, content: {application/json: {schema: {$ref: '#/components/schemas/DepositResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /admin/instruments:
    post:
      tags: [Administration]
      summary: Create instrument
      x-roles: [ADMIN]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminInstrumentRequest'}}}
      responses:
        '201': {description: Created instrument, content: {application/json: {schema: {$ref: '#/components/schemas/Instrument'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /admin/instruments/{symbol}:
    put:
      tags: [Administration]
      summary: Update instrument
      x-roles: [ADMIN]
      parameters: [{$ref: '#/components/parameters/Symbol'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminInstrumentRequest'}}}
      responses:
        '200': {description: Updated instrument, content: {application/json: {schema: {$ref: '#/components/schemas/Instrument'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /admin/demo/reset:
    post:
