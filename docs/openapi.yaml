      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/VerifyReplayRequest'}}}
      responses:
        '200': {description: Replay result, content: {application/json: {schema: {$ref: '#/components/schemas/VerifyReplayResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
