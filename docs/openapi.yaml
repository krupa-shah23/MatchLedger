      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SimulatorStartRequest'}}}
      responses:
        '202': {description: Start requested, content: {application/json: {schema: {$ref: '#/components/schemas/CommandAcceptedResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /system/simulator/stop:
    post:
      tags: [System]
      summary: Stop simulator
      x-roles: [ADMIN]
      responses:
        '202': {description: Stop requested, content: {application/json: {schema: {$ref: '#/components/schemas/CommandAcceptedResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /system/chaos/kill-shard:
    post:
      tags: [System]
      summary: Kill shard
      x-roles: [ADMIN]
      x-demo-only: true
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ShardCommandRequest'}}}
      responses:
        '202': {description: Kill requested, content: {application/json: {schema: {$ref: '#/components/schemas/CommandAcceptedResponse'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
