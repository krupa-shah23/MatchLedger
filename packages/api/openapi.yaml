openapi: 3.0.3
info:
  title: MatchLedger API
  version: 0.1.0
  description: Secure HTTP API for MatchLedger trading platform with CQRS read-side projections

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.matchledger.example.com
    description: Production server

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required:
        - type
        - title
        - status
        - code
        - detail
        - instance
        - requestId
      properties:
        type:
          type: string
          example: "about:blank#validation_failed"
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - validation_failed
            - unauthenticated
            - forbidden
            - not_found
            - conflict
            - payload_too_large
            - rate_limited
            - service_unavailable
            - internal_error
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string

    Order:
      type: object
      properties:
        orderId:
          type: string
        clientOrderId:
          type: string
        accountId:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        type:
          type: string
          enum: [LIMIT, MARKET]
        timeInForce:
          type: string
          enum: [GTC, IOC]
        quantity:
          type: string
          description: Decimal string
        price:
          type: string
          nullable: true
          description: Decimal string, null for MARKET orders
        effectivePrice:
          type: string
          nullable: true
          description: Decimal string, filled price for executed orders
        filledQty:
          type: string
          description: Decimal string, quantity filled
        status:
          type: string
          enum: [RECEIVED, ACCEPTED, RESTING, PARTIALLY_FILLED, FILLED, CANCEL_REQUESTED, CANCELLED, REJECTED]
        cancelRequested:
          type: boolean
        terminal:
          type: string
          nullable: true
          enum: [CANCELLED, REJECTED]
        terminalReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Balances:
      type: object
      properties:
        accountId:
          type: string
        cash:
          type: string
          description: Decimal string, total cash
        heldCash:
          type: string
          description: Decimal string, held by reservations
        available:
          type: string
          description: Decimal string, available for new reservations

paths:
  /orders:
    post:
      tags: [Orders]
      summary: Submit an order
      operationId: submitOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientOrderId, symbol, side, type, timeInForce, quantity]
              properties:
                clientOrderId:
                  type: string
                  maxLength: 64
                symbol:
                  type: string
                side:
                  type: string
                  enum: [BUY, SELL]
                type:
                  type: string
                  enum: [LIMIT, MARKET]
                timeInForce:
                  type: string
                  enum: [GTC, IOC]
                quantity:
                  oneOf:
                    - type: string
                    - type: number
                price:
                  oneOf:
                    - type: string
                    - type: number
                  nullable: true
      responses:
        '202':
          description: Order accepted (durably journaled)
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                  status:
                    type: string
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (wrong role)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable (queue full)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Orders]
      summary: List orders with pagination
      operationId: listOrders
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
          description: Required for non-TRADER roles
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque pagination cursor
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Orders list
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  nextCursor:
                    type: string
                    nullable: true

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Orders]
      summary: Cancel an order
      operationId: cancelOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Cancel request accepted
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict (terminal order, different payload)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{id}/events:
    get:
      tags: [Orders]
      summary: Get order audit timeline
      operationId: getOrderEvents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ts:
                      type: integer
                      format: int64
                    stageRank:
                      type: integer
                      description: RISK_COMMAND=1, RISK_ACCEPT=2, ENGINE=3, RISK_NOTICE=4
                    seq:
                      type: integer
                    idx:
                      type: integer
                    source:
                      type: string
                    payload:
                      type: string
                      description: JSON-serialized event payload
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /instruments:
    get:
      tags: [Market]
      summary: List all instruments
      operationId: listInstruments
      responses:
        '200':
          description: Instruments list

  /instruments/{symbol}:
    get:
      tags: [Market]
      summary: Get instrument details
      operationId: getInstrument
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Instrument details

  /symbols/{symbol}/book:
    get:
      tags: [Market]
      summary: Get order book
      operationId: getBook
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: depth
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Order book with bid/ask levels and seq

  /trades:
    get:
      tags: [Market]
      summary: Get recent trades
      operationId: getTrades
      parameters:
        - name: symbol
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Recent trades

  /status:
    get:
      tags: [Market]
      summary: Get breaker status
      operationId: getStatus
      responses:
        '200':
          description: Breaker status for all symbols

  /accounts/{id}/balances:
    get:
      tags: [Accounts]
      summary: Get account balances
      operationId: getBalances
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balances'

  /accounts/{id}/positions:
    get:
      tags: [Accounts]
      summary: Get account positions
      operationId: getPositions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account positions

  /accounts/{id}/pnl:
    get:
      tags: [Accounts]
      summary: Get account P&L
      operationId: getPnl
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account P&L

  /accounts/{id}/reservations:
    get:
      tags: [Accounts]
      summary: Get account reservations
      operationId: getReservations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account reservations

  /accounts/{id}/ledger:
    get:
      tags: [Accounts]
      summary: Get account ledger
      operationId: getLedger
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Ledger lines (debit/credit)

  /risk/symbols/{symbol}/halt:
    post:
      tags: [Risk]
      summary: Halt trading on a symbol
      operationId: haltSymbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '202':
          description: Halt request accepted
        '403':
          description: Forbidden (wrong role)

  /risk/symbols/{symbol}/resume:
    post:
      tags: [Risk]
      summary: Resume trading on a symbol
      operationId: resumeSymbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Resume request accepted

  /risk/rejections:
    get:
      tags: [Risk]
      summary: Get rejection feed
      operationId: getRejections
      parameters:
        - name: reason
          in: query
          schema:
            type: string
        - name: accountId
          in: query
          schema:
            type: string
        - name: symbol
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Rejections list

  /risk/breakers:
    get:
      tags: [Risk]
      summary: Get breaker status
      operationId: getBreakers
      responses:
        '200':
          description: Breakers status for all symbols

  /recon/runs:
    post:
      tags: [Recon]
      summary: Upload reconciliation statement
      operationId: uploadReconRun
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Upload accepted
        '400':
          description: Invalid upload (no file, multiple files, wrong type)
        '413':
          description: Payload too large

    get:
      tags: [Recon]
      summary: List reconciliation runs
      operationId: listReconRuns
      responses:
        '200':
          description: Reconciliation runs

  /recon/breaks:
    get:
      tags: [Recon]
      summary: List breaks from runs
      operationId: listBreaks
      responses:
        '200':
          description: Breaks list

  /recon/breaks/{id}:
    get:
      tags: [Recon]
      summary: Get break details
      operationId: getBreak
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Break details

  /recon/breaks/{id}/status:
    post:
      tags: [Recon]
      summary: Change break status
      operationId: setBreakStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '202':
          description: Status change accepted
        '409':
          description: Conflict (illegal transition)

  /recon/breaks/{id}/resolve:
    post:
      tags: [Recon]
      summary: Resolve a break
      operationId: resolveBreak
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                adjustment:
                  type: object
                  properties:
                    asset:
                      type: string
                    amount:
                      type: string
      responses:
        '202':
          description: Resolution accepted
        '409':
          description: Conflict (concurrent resolution)

  /recon/breaks/{id}/audit:
    get:
      tags: [Recon]
      summary: Get break audit trail
      operationId: getBreakAudit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audit trail

  /recon/runs/{id}:
    get:
      tags: [Recon]
      summary: Get reconciliation run details
      operationId: getReconRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reconciliation run details

  /ws:
    get:
      tags: [WebSocket]
      summary: WebSocket gateway for real-time updates
      operationId: wsGateway
      responses:
        '101':
          description: Switching Protocols to WebSocket

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and obtain JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh JWT token
      operationId: refreshToken
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time

  /me:
    get:
      tags: [Auth]
      summary: Get current user info
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  username:
                    type: string
                  role:
                    type: string
                    enum: [TRADER, RISK, OPS, ADMIN]

  /admin/users:
    get:
      tags: [Admin]
      summary: List users
      operationId: listUsers
      responses:
        '200':
          description: Users list

    post:
      tags: [Admin]
      summary: Create user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [TRADER, RISK, OPS, ADMIN]
      responses:
        '200':
          description: User created
        '400':
          description: Validation error (weak password)
        '409':
          description: Conflict (username exists)

  /admin/accounts:
    get:
      tags: [Admin]
      summary: List accounts
      operationId: listAccounts
      responses:
        '200':
          description: Accounts list

    post:
      tags: [Admin]
      summary: Create account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, owner_user_id]
              properties:
                account_id:
                  type: string
                owner_user_id:
                  type: string
      responses:
        '200':
          description: Account created

  /admin/accounts/{id}/deposit:
    post:
      tags: [Admin]
      summary: Deposit funds to account
      operationId: depositFunds
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, asset, amount]
              properties:
                requestId:
                  type: string
                asset:
                  type: string
                amount:
                  type: string
      responses:
        '202':
          description: Deposit accepted
        '409':
          description: Conflict (duplicate requestId)

  /admin/demo/reset:
    post:
      tags: [Admin]
      summary: Reset demo environment (demo only, idempotent)
      operationId: resetDemo
      responses:
        '200':
          description: Demo environment reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset:
                    type: boolean
                  simulatorCleared:
                    type: boolean
                  message:
                    type: string
        '500':
          description: Internal server error

  /admin/demo/chaos/kill/{symbol}:
    post:
      tags: [Admin]
      summary: Kill shard (demo only)
      operationId: killShard
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '202':
          description: Kill command queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  action:
                    type: string
                  queued:
                    type: boolean
        '500':
          description: Internal server error

  /admin/demo/chaos/freeze/{symbol}:
    post:
      tags: [Admin]
      summary: Freeze shard (demo only)
      operationId: freezeShard
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                durationMs:
                  type: integer
                reason:
                  type: string
      responses:
        '202':
          description: Freeze command queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  action:
                    type: string
                  durationMs:
                    type: integer
                  queued:
                    type: boolean
        '500':
          description: Internal server error

  /system/invariants:
    get:
      tags: [System]
      summary: Check system invariants
      operationId: getInvariants
      responses:
        '200':
          description: System invariants check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  ledgerZeroSum:
                    type: boolean
                  positionsZeroSum:
                    type: boolean
                  noNegativeAvailable:
                    type: boolean
                  projectionsEqualRisk:
                    type: boolean

  /system/health:
    get:
      tags: [System]
      summary: System health status
      operationId: getHealth
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  projectorLagSeq:
                    type: integer
                  pipelineState:
                    type: string

  /system/shards:
    get:
      tags: [System]
      summary: Get shard status and heartbeat info
      operationId: getShards
      responses:
        '200':
          description: Shard status including lease, heartbeat, and journal info
          content:
            application/json:
              schema:
                type: object
                properties:
                  shards:
                    type: array
                    items:
                      type: object
                      properties:
                        leaseId:
                          type: string
                        owner:
                          type: string
                        epoch:
                          type: integer
                        acquiredAt:
                          type: string
                          format: date-time
                        lastHeartbeatAt:
                          type: string
                          format: date-time
                        lastSeq:
                          type: integer
                        ownedSymbols:
                          type: array
                          items:
                            type: string
                        snapshotSeq:
                          type: integer
                        journalSeq:
                          type: integer
                        isStale:
                          type: boolean
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /system/recovery:
    get:
      tags: [System]
      summary: Get recovery log history
      operationId: getRecovery
      responses:
        '200':
          description: Recovery operation log
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        leaseId:
                          type: string
                        startedAt:
                          type: string
                          format: date-time
                        completedAt:
                          type: string
                          format: date-time
                        durationMs:
                          type: integer
                        snapshotSeq:
                          type: integer
                        tailLength:
                          type: integer
                        symbolsRecovered:
                          type: array
                          items:
                            type: string
                        createdAt:
                          type: string
                          format: date-time
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /system/metrics/summary:
    get:
      tags: [System]
      summary: Get metrics summary from Prometheus
      operationId: getMetricsSummary
      responses:
        '200':
          description: Aggregate metrics summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                  windowSeconds:
                    type: integer
                    nullable: true
                  commandsPerSec:
                    type: number
                    nullable: true
                  latencyMs:
                    type: object
                    nullable: true
                    properties:
                      p50:
                        type: number
                      p95:
                        type: number
                      p99:
                        type: number
                  queueDepthMax:
                    type: integer
                    nullable: true
                  consumerLagMax:
                    type: integer
                    nullable: true
                  eventLoopP99Ms:
                    type: number
                    nullable: true
                  byShard:
                    type: array
                    items:
                      type: object
                      properties:
                        leaseId:
                          type: string
                        commandsPerSec:
                          type: number

  /system/verify-replay:
    post:
      tags: [System]
      summary: Verify journal replay integrity
      operationId: verifyReplay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [streamId]
              properties:
                streamId:
                  type: string
                  description: Stream ID (symbol) to verify
      responses:
        '200':
          description: Replay verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  streamId:
                    type: string
