name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm test
  integration:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: docker compose up -d postgres redis kafka
      - name: Wait for integration services
        shell: bash
        run: |
          set -uo pipefail
          deadline=$((SECONDS + 90))
          until docker compose exec -T postgres pg_isready -U postgres >/dev/null 2>&1 &&
                docker compose exec -T redis redis-cli ping 2>/dev/null | grep -qx PONG &&
                docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for Postgres, Redis, or Kafka."
              docker compose logs --no-color
              exit 1
            fi
            sleep 3
          done
      - name: Run opt-in integration tests
        env:
          RUN_CONTAINERS: "1"
          RUN_KAFKA_SPIKE: "1"
          RUN_INTEGRATION: "1"
        run: npm test
      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down integration services
        if: always()
        run: docker compose down -v
