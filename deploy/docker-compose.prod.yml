services:
  postgres:
    ports: !override []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes: !override
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    logging: &rotated-logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G }

  redis:
    ports: !override []
    volumes:
      - redis-data:/data
    restart: unless-stopped
    logging: *rotated-logs
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  kafka:
    ports: !override []
    environment:
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}
    volumes:
      - kafka-data:/tmp
    restart: unless-stopped
    logging: *rotated-logs
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1536M }

  prometheus:
    ports: !override []
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://127.0.0.1:9090/-/healthy]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *rotated-logs
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  grafana:
    ports: !override []
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_SERVER_ROOT_URL: https://${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/.env}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *rotated-logs
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  api:
    image: matchledger-api:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ${DEPLOY_ENV_FILE:-deploy/.env}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
      PROMETHEUS_URL: http://prometheus:9090
      KAFKA_BROKERS: kafka:9092
      TRANSPORT: kafka
      METRICS_HOST: 0.0.0.0
    command: [node, --max-old-space-size=768, packages/api/dist/main.js]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *rotated-logs
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 1G }

  topic-init:
    image: matchledger-api:${APP_IMAGE_TAG:-local}
    env_file:
      - ${DEPLOY_ENV_FILE:-deploy/.env}
    environment:
      KAFKA_BROKERS: kafka:9092
    entrypoint: [node, scripts/create-topics.mjs]
    command: [--bootstrap-server=kafka:9092]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    logging: *rotated-logs
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  shard-0:
    image: matchledger-shard:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.shard
    env_file:
      - ${DEPLOY_ENV_FILE:-deploy/.env}
    environment:
      NODE_OPTIONS: --max-old-space-size=512
      METRICS_PORT: 9101
      SHARD_ID: shard-0
      TRANSPORT: kafka
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:9101/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *rotated-logs
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 512M }

  shard-1:
    image: matchledger-shard:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.shard
    env_file:
      - ${DEPLOY_ENV_FILE:-deploy/.env}
    environment:
      NODE_OPTIONS: --max-old-space-size=512
      METRICS_PORT: 9101
      SHARD_ID: shard-1
      TRANSPORT: kafka
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:9101/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *rotated-logs
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 512M }

  proxy:
    image: matchledger-proxy:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.proxy
      args:
        VITE_PROFILE: ${PROFILE:-prod}
    env_file:
      - ${DEPLOY_ENV_FILE:-deploy/.env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      grafana:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://127.0.0.1:2019/config/]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *rotated-logs
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:
