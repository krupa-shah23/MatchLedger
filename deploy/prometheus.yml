global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: api
    static_configs:
      - targets: [api:3001]
  - job_name: shards
    static_configs:
      - targets: [shard-0:9101, shard-1:9101]
